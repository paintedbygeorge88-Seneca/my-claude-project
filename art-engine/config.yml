currency: "EUR"

# --- Pinterest drip (the automatic part) ---
# Every artwork becomes a stream of different pins (styled poster, room mockups,
# close-up texture details). The engine releases a few per day, forever, so your
# Pinterest account stays active without you touching it.
pins_per_day: 3
pin_start_date: 2026-11-01
recycle_after_days: 90     # after this, an artwork gets a fresh set of new pin images
max_cycles: 6              # how many fresh sets per artwork (6 x 6 = 36 pins each)

# Used when an artwork has no buy_links of its own (e.g. your Etsy shop front).
default_buy_links: []
#  - label: "Shop prints on Etsy"
#    url: "https://www.etsy.com/shop/YOURSHOP"

# Verification codes (paste them in during the one-time setup, see README)
pinterest_verify: ""     # the content="..." value from Pinterest's "claim website" meta tag
google_verify: ""        # the content="..." value from Google Search Console's meta tag
